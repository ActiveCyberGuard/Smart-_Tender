<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TenderFlow</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 48 48" aria-label="MT logo"><rect width="48" height="48" rx="8" fill="#0b5d63"/><circle cx="24" cy="24" r="19" fill="none" stroke="#fff" stroke-width="2"/><text x="24" y="30" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="17" fill="#fff">MT</text></svg>
    <div><b>TenderFlow</b><small data-i="tag"></small></div>
  </div>
  <div class="right"><span id="tid" class="pill"></span>
    <div class="lang"><button data-l="bn">বাংলা</button><button data-l="en" class="on">English</button></div></div>
</header>
<ol class="steps" id="steps"></ol>
<main>
  <section class="card" id="tender"></section>
  <section class="kpis" id="kpis"></section>
  <section class="grid">
    <div class="card">
      <div class="drop" id="reqDrop"><b data-i="loadReq"></b><span data-i="loadReqHint"></span>
        <input type="file" id="reqIn" accept=".json,application/json"></div>
      <div id="table"></div>
    </div>
    <aside>
      <div class="card health" id="health"></div>
      <div class="card">
        <div class="drop" id="pdfDrop"><b data-i="upload"></b><span data-i="uploadHint"></span>
          <input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple></div>
        <div id="totals" class="muted"></div>
        <div id="files"></div>
      </div>
    </aside>
  </section>
</main>
<footer class="bar">
  <button id="reset" class="ghost" data-i="reset"></button>
  <button id="suggest" class="ghost" data-i="suggest"></button>
  <span id="why" class="why"></span>
  <button id="gen" class="primary" data-i="gen"></button>
</footer>
<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
